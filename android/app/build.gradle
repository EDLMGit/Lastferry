plugins {
    id 'com.android.application'
}

def playtestVersion = providers.gradleProperty('playtestVersion').orElse('5').get().toInteger()
def gameRoot = rootProject.projectDir.parentFile
def bundledGame = layout.buildDirectory.dir('generated/coveAssets')

android {
    namespace 'com.lastferry.playtest'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.lastferry.playtest'
        minSdk 29
        targetSdk 36
        versionCode playtestVersion
        versionName "0.1.${playtestVersion}-playtest"
    }

    sourceSets.main.assets.srcDir(bundledGame)
}

dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
}

def buildGame = tasks.register('buildCoveAssets', Exec) {
    workingDir gameRoot
    environment 'VITE_LAST_FERRY_QA', '0'
    commandLine 'node', new File(gameRoot, 'node_modules/vite/bin/vite.js'), 'build',
        '--outDir', bundledGame.get().asFile.absolutePath, '--emptyOutDir'
}

tasks.named('preBuild').configure {
    dependsOn buildGame
}
