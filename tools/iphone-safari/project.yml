name: SafariCrossing
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: "5.0"
targets:
  ProbeHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.lastferry.qa.host
  CrossingTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ProbeHost
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.lastferry.qa.crossing
      TEST_TARGET_NAME: ProbeHost
schemes:
  Crossing:
    build:
      targets:
        ProbeHost: all
        CrossingTests: [test]
    test:
      targets: [CrossingTests]
